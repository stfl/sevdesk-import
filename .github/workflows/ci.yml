name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Superseded runs on the same ref are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31 # zizmor: ignore[unpinned-uses]
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Build the dev shell once so the steps below only run their own command.
      - name: Build dev shell
        run: nix develop --command python3 --version

      # Each step runs the same recipe a contributor runs, so the two cannot drift.
      - name: Unit tests
        run: nix develop --command just test -q

      - name: Types
        run: nix develop --command just types

      - name: Format
        run: nix develop --command just fmt-check

      - name: Package builds
        run: nix develop --command just build
